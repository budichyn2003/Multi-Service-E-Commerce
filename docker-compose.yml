name: marketforge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketforge}
      POSTGRES_DB: ${POSTGRES_DB:-marketforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketforge} -d ${POSTGRES_DB:-marketforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: mf-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-marketforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-marketforge}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mf-mailhog
    ports:
      - "${MAILHOG_HTTP_PORT:-8025}:8025"   # web UI
      - "1025:1025"                          # SMTP
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: mf-gateway
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${GATEWAY_PORT:-8080}:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  commerce-go:
    build:
      context: ./apps/commerce-go
      dockerfile: Dockerfile
    container_name: mf-commerce-go
    env_file: .env
    ports:
      - "${COMMERCE_GO_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  order-service:
    build:
      context: ./apps/order-service
      dockerfile: Dockerfile
    container_name: mf-order-service
    env_file: .env
    ports:
      - "${ORDER_SERVICE_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: mf-notification-service
    env_file: .env
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: mf-ai-service
    env_file: .env
    ports:
      - "${AI_SERVICE_PORT:-8084}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mf-web
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_started
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mf-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mf-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
