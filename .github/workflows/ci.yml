name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go commerce service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        working-directory: apps/commerce-go
        run: go test ./...
      - name: Vet
        working-directory: apps/commerce-go
        run: go vet ./...

  order-service:
    name: Spring Boot order service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: apps/order-service
        run: mvn -B test

  notification-service:
    name: .NET notification service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: apps/notification-service
        run: dotnet build

  ai-service:
    name: FastAPI AI service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: apps/ai-service
        run: pip install -r requirements.txt
      - name: Import check
        working-directory: apps/ai-service
        run: python -c "from app.main import app; print('app OK')"

  gateway:
    name: Gateway build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/gateway
        run: npm install
      - name: Build
        working-directory: apps/gateway
        run: npm run build

  docker:
    name: Docker build (all services)
    runs-on: ubuntu-latest
    needs: [go, order-service, notification-service, ai-service, gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t marketforge/commerce-go:${{ github.sha }} apps/commerce-go
          docker build -t marketforge/order-service:${{ github.sha }} apps/order-service
          docker build -t marketforge/notification-service:${{ github.sha }} apps/notification-service
          docker build -t marketforge/ai-service:${{ github.sha }} apps/ai-service
          docker build -t marketforge/gateway:${{ github.sha }} apps/gateway
